<head>
<title>Welcome | Frans Hermans</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

* {
box-sizing: border-box;
margin: 0;
}

p, a {
font-family: Inter;
font-size: 20px;
line-height: 25px;
max-width: 60vw;
text-align: center;
}

.content {
height: 100vh;
width: 100vw;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
flex-wrap: wrap;
}

img {
height: 25vh;
width: 25vh;
object-fit: cover;
animation: logoo 2s infinite;
z-index: -1;
}

a {
text-decoration: none;
border: 1px solid black;
padding: 2px 10px;
border-radius: 10px;
color: black;
margin-top: 50px;
background-color: whitesmoke;
font-size: 17px;
box-shadow: 0 0 10px lightgrey;
}

@keyframes logoo {
from {
transform: rotate(0deg);
}
to {
transform: rotate(360deg);
}
}

</style>


<div class="content">
<img src="logo.png">

</div>
