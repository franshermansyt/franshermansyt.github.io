<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
box-sizing: border-box;
margin: 0;
}

div {
height: 100vh;
width: 100vw;
display: flex;
justify-content: center;
align-items: center;
position: relative;
}

p {
font-family: arial;
font-size: 40px;
animation: frans 5s linear infinite;
background-color: dimgrey;
user-select: none;
padding: 0 3px;
-webkit-text-stroke: 2px grey;
font-weight: bold;
box-shadow: 0 0 100px grey;
}

@keyframes frans {
0% {
color: red;
}
20% {
color: green;
}
40% {
color: blue;
}
60% {
color: purple;
}
80% {
color: yellow;
}
100% {
color: orange;
}
}

</style>

<div>
<p>Frans Hermans</p>
</div>
