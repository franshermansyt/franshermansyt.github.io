<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

* {
box-sizing: border-box;
margin: 0;
font-family: Google Sans;
}

:root {
--blauw: #0080ff;
}

.top {
width: 100vw;
display: flex;
flex-direction: column;
padding: 3vh 0;
}

.top div {
width: 100vw;
display: flex;
justify-content: center;
align-items: center;
}

.top div img {
height: 30px;
width: 30px;
}

.banner {
background-image: url("fransbg.jpeg");
height: 40vh;
width: 100vw;
background-size: cover;
border-radius: 40px 40px 0 0;
}

.contentbox {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
width: 100vw;
}

.info {
width: 80vw;
display: flex;
padding: 3vh 20vw;
text-align: center;
box-shadow: 0 0 20px lightgrey;
border-radius: 30px;
margin: 3vh 0;
flex-direction: column;
gap: 10px;
font-size: 20px;
}

.title {
font-family: Black Ops One;
color: var(--blauw);
font-size: 25px;
transform: rotate(-3deg);
}

.btn {
padding: 5px 0;
border-radius: 10px;
font-size: 17px;
text-decoration: none;
margin: 2vh 0;
}

.warning {
height: 100vh;
width: 100vw;
background-color: rgba(0,0,0,0.5);
position: fixed;
z-index: 1;
display: flex;
justify-content: center;
align-items: center;
display: none;
}

.warning div {
background-color: white;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
width: 80vw;
height: 50vh;
font-size: 30px;
text-align: center;
gap: 20px;
}

.dd {
color: white;
background-color: darkblue;
border-radius: 20px;
padding: 10px;
}

</style>

<div class="warning">
<div>
<b>Attentie!</b>
<p class="msgp">Frans Hermans is de beste YouTube'er ter wereld.</p>
<p class="dd">Accepteren</p><p class="dd">Niet accepteren</p>
</div>
</div>

<div class="top">
<div><img src="logo.jpg"><p style="font-size: 20px;">Frans Hermans</p></div>
<div><p style="font-size: 10px; letter-spacing: 4px;">Daar is geen woord Frans bij</p></div>
</div>

<div class="banner"></div>


<div class="contentbox">

<div class="info">
<p class="title">Wie is Frans?!</p>
<p style="font-size: 20px;">Frans is een doodnormale man die echt wel weet wat hij wil.</p>
<p style="font-size: 10px; color: grey;">Tip: klik op de scooter, dan toetert Frans!</p>
<a href="https://www.youtube.com/@FransHermans-cj2ud" class="btn" style="background-color: red; color: white;">Naar YouTube</a>
</div>


</div>


<script>

const toeter = new Audio("toeter.m4a");

const banner = document.querySelector(".banner");
banner.addEventListener("click", () => {
toeter.play();
});

function getRandomIntInclusive(min, max) {
  const minCeiled = Math.ceil(min);
  const maxFloored = Math.floor(max);
  return Math.floor(Math.random() * (maxFloored - minCeiled + 1) + minCeiled); // The maximum is inclusive and the minimum is inclusive
}

const berichten = [
"Vanaf 2027 staat Frans in Showhol",
"Frans Hermans stopt niet met YouTube",
"Venga boom",
"Frans' keuken is stopgezet",
"Vega tense nu in de aanbieding",
"Hence Frans: niemand weet dit nog"
];

const warning = document.querySelector(".warning");
const msgp = document.querySelector(".msgp");

function opnieuw(x) {
setTimeout(() => {
msgp.textContent = berichten[getRandomIntInclusive(0, berichten.length - 1)];
warning.style.display = "flex";
}, x);
}

warning.addEventListener("click", () => {
warning.style.display = "none";
opnieuw(getRandomIntInclusive(2, 14) * 1000);
});

opnieuw(1000);


</script>
